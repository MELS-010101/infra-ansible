# Обработчики роли db. Вызываются через notify из tasks/main.yml
# и выполняются в конце play ТОЛЬКО если соответствующая задача пометила changed.

# Перезапуск MariaDB после изменения my.cnf.
# Если шаблон не менял файл — handler не запустится и БД не дёрнется (идемпотентность).
- name: restart mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted