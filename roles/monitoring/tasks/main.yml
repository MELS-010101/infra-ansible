---
# Роль monitoring: Node Exporter + Prometheus + Grafana.
# Grafana: берём из apt, если пакет есть; иначе официальный .deb с dl.grafana.com
# (Docker Hub из этой сети недоступен, поэтому без контейнеров).

- name: Создать системного пользователя node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Проверить, установлен ли node_exporter локально
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_bin

- name: Скачать и распаковать node_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
  when: not node_exporter_bin.stat.exists

- name: Установить бинарник node_exporter
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
  when: not node_exporter_bin.stat.exists

- name: Развернуть systemd-юнит node_exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      # Ansible managed
      [Unit]
      Description=Prometheus Node Exporter
      After=network-online.target

      [Service]
      User=node_exporter
      ExecStart=/usr/local/bin/node_exporter --web.listen-address=:{{ node_exporter_port }}
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload systemd
    - restart node_exporter

- name: Node Exporter включён и запущен
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Установить Prometheus из репозитория Ubuntu
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Проверить, есть ли пакет grafana в apt
  ansible.builtin.shell: |
    cand=$(apt-cache policy grafana 2>/dev/null | awk '/Candidate:/{print $2}')
    [ -n "$cand" ] && [ "$cand" != "(none)" ]
  register: grafana_apt
  changed_when: false
  failed_when: false

- name: Установить Grafana из apt (если пакет доступен)
  ansible.builtin.apt:
    name: grafana
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: grafana_apt.rc == 0

- name: Скачать официальный deb Grafana (если в apt пакета нет)
  ansible.builtin.get_url:
    url: "https://dl.grafana.com/oss/release/grafana_{{ grafana_version }}_amd64.deb"
    dest: /tmp/grafana.deb
    mode: "0644"
  when: grafana_apt.rc != 0

- name: Установить deb Grafana
  ansible.builtin.apt:
    deb: /tmp/grafana.deb
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: grafana_apt.rc != 0

- name: Конфигурация Prometheus (scrape-таргеты)
  ansible.builtin.copy:
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
    content: |
      # Ansible managed
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:{{ prometheus_port }}"]
        - job_name: node
          static_configs:
            - targets: ["localhost:{{ node_exporter_port }}"]
        - job_name: mysqld
          static_configs:
            - targets: ["localhost:9101"]
  notify: restart prometheus

- name: Prometheus включён и запущен
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true

- name: Каталог provisioning datasources Grafana
  ansible.builtin.file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    mode: "0755"

- name: Datasource Prometheus для Grafana (provisioning)
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/datasources/ansible-prometheus.yml
    mode: "0644"
    content: |
      # Ansible managed
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://localhost:{{ prometheus_port }}
          isDefault: true
          uid: prometheus
  notify: restart grafana

- name: Каталог drop-in для Grafana
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: "0755"

- name: "Drop-in: пароль админа Grafana из vault"
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/override.conf
    mode: "0640"
    content: |
      # Ansible managed
      [Service]
      Environment=GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
  no_log: true
  notify:
    - reload systemd
    - restart grafana

- name: Grafana включена и запущена
  ansible.builtin.systemd:
    name: grafana-server
    state: started
    enabled: true
    daemon_reload: true

- name: UFW — открыть порты Grafana и Prometheus
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ grafana_port }}"
    - "{{ prometheus_port }}"
  when: ufw_enabled | default(false) | bool
  - name: Каталог для provisioned-дашбордов Grafana
  ansible.builtin.file:
    path: /etc/grafana/dashboards
    state: directory
    mode: "0755"

- name: Дашборд LEMP Overview (JSON из кода)
  ansible.builtin.copy:
    src: lemp-overview.json
    dest: /etc/grafana/dashboards/lemp-overview.json
    mode: "0644"
  notify: restart grafana

- name: Provisioning-провайдер дашбордов
  ansible.builtin.copy:
    dest: /etc/grafana/provisioning/dashboards/ansible.yml
    mode: "0644"
    content: |
      # Ansible managed
      apiVersion: 1
      providers:
        - name: ansible-dashboards
          orgId: 1
          type: file
          updateIntervalSeconds: 30
          options:
            path: /etc/grafana/dashboards
  notify: restart grafana
