---
# Роль backup: шифрованные бэкапы СУБД с ротацией, логом и отказоустойчивостью.
# ПАКЕТЫ СУБД СТАВИТ ТОЛЬКО РОЛЬ db — здесь клиент только как fallback.

- name: Установить cron и openssl
  ansible.builtin.apt:
    name:
      - cron
      - openssl
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Сервис cron запущен и включён
  ansible.builtin.systemd:
    name: cron
    state: started
    enabled: true

- name: Проверить, есть ли mysqldump в системе
  ansible.builtin.command: which mysqldump
  register: mysqldump_check
  changed_when: false
  failed_when: false

- name: Проверить, установлен ли mariadb-server
  ansible.builtin.shell: dpkg-query -W -f='${Status}' mariadb-server 2>/dev/null || true
  register: mariadb_pkg
  changed_when: false

- name: Установить клиент СУБД (fallback, flavor-aware)
  ansible.builtin.apt:
    name: "{{ 'mariadb-client' if 'install ok installed' in mariadb_pkg.stdout else 'mysql-client' }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: mysqldump_check.rc != 0

- name: Создать каталог резервных копий MySQL
  ansible.builtin.file:
    path: "{{ mysql_backup_dir }}"
    state: directory
    mode: "0750"

- name: Сгенерировать ключ шифрования бэкапов (один раз)
  ansible.builtin.shell: openssl rand -hex 32 > /etc/mysql-backup.key && chmod 600 /etc/mysql-backup.key
  args:
    creates: /etc/mysql-backup.key

- name: Создать файл учётных данных MySQL для бэкапов
  ansible.builtin.copy:
    dest: /etc/mysql-backup.cnf
    mode: "0600"
    content: |
      # Ansible managed
      [client]
      user={{ mysql_backup_user }}
      password="{{ mysql_backup_password }}"
  no_log: true

- name: Создать скрипт резервного копирования MySQL
  ansible.builtin.copy:
    dest: /usr/local/bin/mysql-backup.sh
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Бэкап всех баз: dump -> gzip -> openssl (aes-256-cbc, pbkdf2) -> ротация.
      # Ошибки пишем в лог и шлём в Telegram (если настроен), а не молча умираем.
      set -uo pipefail

      BACKUP_DIR="{{ mysql_backup_dir }}"
      KEY_FILE="/etc/mysql-backup.key"
      LOG="/var/log/db_backup.log"
      ALERTS_CONF="/etc/backup-alerts.conf"
      STAMP="$(date +%Y%m%d-%H%M%S)"
      RETENTION_DAYS="7"
      TMP="${BACKUP_DIR}/.tmp-all-${STAMP}.sql.gz"
      OUT="${BACKUP_DIR}/all-${STAMP}.sql.gz.enc"

      log()  { echo "$(date '+%F %T') $*" >> "$LOG"; }

      alert() {
        log "ERROR: $*"
        # Опциональный Telegram-хук: создай /etc/backup-alerts.conf с
        # TELEGRAM_TOKEN=... и TELEGRAM_CHAT_ID=... — и алерты поедут в чат.
        if [ -r "$ALERTS_CONF" ]; then
          # shellcheck disable=SC1090
          . "$ALERTS_CONF"
          curl -fsS -m 10 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="[infra-ansible] backup FAILED: $*" || true
        fi
      }

      # Ждём доступность СУБД, но не бесконечно
      for i in {1..30}; do
        if /usr/bin/mysqladmin --defaults-extra-file=/etc/mysql-backup.cnf ping >/dev/null 2>&1; then
          break
        fi
        sleep 2
        if [ "$i" -eq 30 ]; then
          alert "СУБД недоступна, бэкап не выполнен"
          exit 1
        fi
      done

      if ! /usr/bin/mysqldump \
            --defaults-extra-file=/etc/mysql-backup.cnf \
            --all-databases --single-transaction --quick \
            --routines --triggers --events | gzip > "$TMP"; then
        alert "mysqldump завершился с ошибкой"
        rm -f "$TMP"
        exit 1
      fi

      if ! openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$TMP" -out "$OUT" -pass "file:$KEY_FILE"; then
        alert "ошибка шифрования архива"
        rm -f "$TMP"
        exit 1
      fi
      rm -f "$TMP"

      find "$BACKUP_DIR" -maxdepth 1 -type f -name 'all-*.sql.gz.enc' -mtime +"$RETENTION_DAYS" -delete

      log "OK: $OUT ($(stat -c%s "$OUT") bytes)"
      touch "${BACKUP_DIR}/.initial_enc_done"

- name: "Cron: ежедневный бэкап MySQL"
  ansible.builtin.cron:
    name: mysql backup daily
    user: root
    minute: "{{ mysql_backup_cron_minute }}"
    hour: "{{ mysql_backup_cron_hour }}"
    job: "/usr/local/bin/mysql-backup.sh >> /var/log/db_backup.log 2>&1"

- name: Первый бэкап (block/rescue/always — падение не роняет плейбук)
  block:
    - name: Выполнить первый бэкап
      ansible.builtin.command: /usr/local/bin/mysql-backup.sh
      args:
        creates: "{{ mysql_backup_dir }}/.initial_enc_done"
  rescue:
    - name: Алерт-маркер для админа
      ansible.builtin.copy:
        dest: /var/log/db_backup_alert
        mode: "0644"
        content: |
          Первый бэкап завершился с ошибкой.
          Подробности: /var/log/db_backup.log
    - name: Хвост лога бэкапа
      ansible.builtin.command: tail -n 10 /var/log/db_backup.log
      register: backup_log_tail
      failed_when: false
      changed_when: false
    - name: Показать лог в выводе плейбука
      ansible.builtin.debug:
        msg: "{{ backup_log_tail.stdout_lines | default(['лог пуст']) }}"
  always:
    - name: Блок бэкапа завершил работу
      ansible.builtin.debug:
        msg: "backup play finished (block/rescue/always отработал)"

- name: Удалить старые НЕзашифрованные дампы (после появления шифрованного)
  ansible.builtin.shell: |
    if ls "{{ mysql_backup_dir }}"/all-*.sql.gz.enc >/dev/null 2>&1; then
      find "{{ mysql_backup_dir }}" -maxdepth 1 -type f -name 'all-*.sql.gz' -delete
    fi
  changed_when: false

- name: Дамп при загрузке (если стенд был выключен в 02:30)
  ansible.builtin.cron:
    name: mysql backup on reboot
    user: root
    special_time: reboot
    job: "/usr/local/bin/mysql-backup.sh >> /var/log/db_backup.log 2>&1"
