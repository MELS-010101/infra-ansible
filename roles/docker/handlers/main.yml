# Обработчики роли docker. Вызываются через notify из tasks/main.yml
# и выполняются в конце play ТОЛЬКО если соответствующая задача пометила changed.
# daemon_reload не нужен: меняем конфиг демона (daemon.json), а не systemd-юнит.

# Перезапуск Docker после изменения /etc/docker/daemon.json.
# Если шаблон не менял файл — handler не запустится и docker не дёрнется (идемпотентность).
- name: restart docker
  ansible.builtin.service:
    name: docker
    state: restarted