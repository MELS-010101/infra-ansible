---
# Роль docker: гарантирует наличие Docker Engine и включённый сервис.
# ВАЖНО: если Docker уже установлен (docker-ce + containerd.io + runc из
# официального репозитория), ничего не ставим — docker.io из Ubuntu с ними
# конфликтует (containerd.io : Conflicts: containerd, runc : Conflicts: runc).

- name: Проверить, установлен ли Docker
  ansible.builtin.command: which docker
  register: docker_bin
  changed_when: false
  failed_when: false

- name: Установить docker.io, только если Docker совсем отсутствует
  ansible.builtin.apt:
    name:
      - docker.io
      - ca-certificates
      - curl
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: docker_bin.rc != 0

- name: Сервис Docker запущен и включён
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Создать каталог для инфраструктурных файлов
  ansible.builtin.file:
    path: /opt/infra-ansible
    state: directory
    mode: "0755"
