---
- name: Каталог демо-приложения
  ansible.builtin.file:
    path: /opt/demo-app
    state: directory
    mode: "0755"

- name: Файлы демо-приложения (app, Dockerfile, compose)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /opt/demo-app/{{ item }}
    mode: "0644"
  loop:
    - app.py
    - Dockerfile
    - docker-compose.yml

- name: Собрать и запустить демо-приложение (docker compose)
  ansible.builtin.command: docker compose -f /opt/demo-app/docker-compose.yml up -d --build
  register: compose_up
  changed_when: >
    ('Created' in compose_up.stderr) or ('Recreated' in compose_up.stderr)
    or ('Started' in compose_up.stderr)
