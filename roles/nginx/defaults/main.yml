# Значения по умолчанию роли nginx. Переопределяются через group_vars/host_vars.
# То, что задаёт оператор под среду (имя сайта, порт, версия PHP, корень) — в group_vars/web.yml.
# Здесь — внутренние настройки роли с безопасными дефолтами.

# Максимальный размер тела запроса (лимит загрузки файлов через nginx)
nginx_client_max_body_size: "10M"

# Пути логов сайта (подставляются в шаблон; оператор может перенаправить, например, в /var/log/app)
nginx_access_log: /var/log/nginx/access.log
nginx_error_log: /var/log/nginx/error.log

# Включить ли обработку PHP в конфиге сайта.
# true  -> шаблон добавит блок location ~ \.php$ (LEMP-стек).
# false -> nginx отдаёт только статику (чистый веб-сервер без PHP).
nginx_enable_php: true