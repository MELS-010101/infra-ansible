# inventory.ini — инвентарь проекта.
# РЕЖИМ: локальный прогон (connection=local) — роли применяются к самому WSL без SSH.
# ТРЮК ДЛЯ LOCAL: в обеих группах ОДНО имя (localhost). Тогда ansible считает это
# ОДНИМ хостом в двух группах — он получит и group_vars/web.yml, и group_vars/db.yml,
# а apt/пакеты пойдут один раз (иначе два алиаса на одну машину ловят lock apt).
# Для боевого прогона по SSH сюда вернут два разных ansible_host и уберут connection=local.

[web]
localhost

[db]
localhost

[all:vars]
# Применять задачи локально, без SSH (управляющая машина = цель)
ansible_connection=local
# Системный интерпретатор Python на цели (без warning'ов про auto-detect)
ansible_python_interpreter=/usr/bin/python3