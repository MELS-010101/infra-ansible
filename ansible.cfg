# ansible.cfg — настройки проекта.
# ВАЖНО: формат INI НЕ поддерживает комментарии в конце строки со значением
# (inline-комментарии) — они ломают парсинг чисел и булевых. Поэтому ВСЕ
# пояснения вынесены отдельными строками НАД параметром.

[defaults]
# Где лежит инвентарь по умолчанию (чтобы не писать -i каждый раз)
inventory = ./inventory/inventory.ini
# Где ansible ищет роли (путь относительно этого файла)
roles_path = ./roles
# Ключ от Vault по умолчанию (файл локальный, лежит в .gitignore)
vault_password_file = ./.vault_pass
# Сколько хостов обрабатывать параллельно
forks = 10
# Не плодить .retry-файлы после падений (лишний мусор в репозитории)
retry_files_enabled = False
# Не спрашивать подтверждение отпечатка SSH при первом подключении (лаба/демо)
host_key_checking = False
# Человекочитаемый вывод плейбуков (отступы вместо простыни)
stdout_callback = yaml
# Тихо выбирать интерпретатор Python на целях, без warning
interpreter_python = auto_silent

[privilege_escalation]
# Пароль sudo не запрашивать (у админа NOPASSWD из роли common)
become_ask_pass = False

[ssh_connection]
# pipelining ускоряет прогон, убирая лишние SSH-сессии на задачу
pipelining = True