# Внешние коллекции, которые использует проект.
# Ставятся один раз командой из блока ниже (ansible-galaxy collection install -r requirements.yml).
# community.mysql  — модули mysql_user / mysql_db / mysql_query для роли db
# community.docker — модули docker_* для роли docker
collections:
  - name: community.mysql
    version: ">=3.9.0,<4.0.0"
  - name: community.docker
    version: ">=3.7.0,<4.0.0"