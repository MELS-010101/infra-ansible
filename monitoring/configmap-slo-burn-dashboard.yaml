apiVersion: v1
data:
  slo-burn-dashboard.json: |
    {
      "title": "SLO / Burn: demo-app",
      "uid": "slo-burn-demo",
      "tags": ["slo", "burn-rate"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Error Budget Remaining (30d)",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "instant": true, "expr": "slo:demo_app:budget_remaining_percent30d"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 20}, {"color": "green", "value": 50}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 2, "type": "stat", "title": "Availability (30d)",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "instant": true, "expr": "(1 - slo:demo_app:error_ratio30d) * 100"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 99}, {"color": "green", "value": 99.9}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 3, "type": "timeseries", "title": "Burn rate (5m window, xN)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "slo:demo_app:burn_rate5m", "legendFormat": "burn rate x"}],
          "fieldConfig": {"defaults": {"unit": "short", "min": 0}, "overrides": []},
          "options": {}
        },
        {
          "id": 4, "type": "timeseries", "title": "Error budget spent (30d window, %)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "slo:demo_app:error_ratio30d / 0.01 * 100", "legendFormat": "budget spent %"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0}, "overrides": []},
          "options": {}
        }
      ]
    }
kind: ConfigMap
metadata:
  labels:
    grafana_dashboard: "1"
  name: slo-burn-dashboard
  namespace: monitoring
