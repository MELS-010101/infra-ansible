apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-slo
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: demo-app.slo
      rules:
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="demo-app", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="demo-app"}[5m]))
            ) > 0.01
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "🚨 Высокий error rate в demo-app"
            description: "5xx ошибок больше 1% уже 2 минуты. Текущее значение: {{ $value | humanizePercentage }}"
        - alert: SLOBreach
          expr: |
            (
              sum(rate(http_requests_total{job="demo-app", status!~"5.."}[1h]))
              /
              sum(rate(http_requests_total{job="demo-app"}[1h]))
            ) * 100 < 99
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "💔 SLO пробит в demo-app"
            description: "Доступность за последний час ниже 99%. Текущее значение: {{ $value | humanize }}%"
        - alert: TargetDown
          expr: absent(up{job="demo-app"})
          for: 10s
          labels:
            severity: warning
          annotations:
            summary: "⚠️ demo-app полностью недоступен"
            description: "Prometheus не видит ни одной живой цели demo-app уже больше минуты."
        - alert: ErrorBudgetBurnFast
          expr: |
            (
              sum(rate(http_requests_total{job="demo-app", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{job="demo-app"}[5m]))
            ) > (14.4 * 0.01)
            and
            (
              sum(rate(http_requests_total{job="demo-app", status=~"5.."}[1h]))
              /
              sum(rate(http_requests_total{job="demo-app"}[1h]))
            ) > (14.4 * 0.01)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "🔥 Быстрое сжигание error budget (x14.4)"
            description: "Бюджет горит в 14.4 раза быстрее нормы: ~2% месячного бюджета за час. Реагировать немедленно!"
        - alert: ErrorBudgetBurnSlow
          expr: |
            (
              sum(rate(http_requests_total{job="demo-app", status=~"5.."}[30m]))
              /
              sum(rate(http_requests_total{job="demo-app"}[30m]))
            ) > (6 * 0.01)
            and
            (
              sum(rate(http_requests_total{job="demo-app", status=~"5.."}[6h]))
              /
              sum(rate(http_requests_total{job="demo-app"}[6h]))
            ) > (6 * 0.01)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "🐢 Медленное сжигание error budget (x6)"
            description: "Бюджет горит в 6 раз быстрее нормы: ~5% бюджета за сутки. Разобраться в рабочее время."
