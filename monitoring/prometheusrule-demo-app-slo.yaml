apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-slo
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: demo-app.slo.recording
      interval: 30s
      rules:
        - record: slo:demo_app:requests:rate5m
          expr: sum(rate(http_requests_total{job="demo-app"}[5m]))
        - record: slo:demo_app:errors:rate5m
          expr: sum(rate(http_requests_total{job="demo-app", status=~"5.."}[5m])) or vector(0)
        - record: slo:demo_app:requests:rate30m
          expr: sum(rate(http_requests_total{job="demo-app"}[30m]))
        - record: slo:demo_app:errors:rate30m
          expr: sum(rate(http_requests_total{job="demo-app", status=~"5.."}[30m])) or vector(0)
        - record: slo:demo_app:requests:rate1h
          expr: sum(rate(http_requests_total{job="demo-app"}[1h]))
        - record: slo:demo_app:errors:rate1h
          expr: sum(rate(http_requests_total{job="demo-app", status=~"5.."}[1h])) or vector(0)
        - record: slo:demo_app:requests:rate6h
          expr: sum(rate(http_requests_total{job="demo-app"}[6h]))
        - record: slo:demo_app:errors:rate6h
          expr: sum(rate(http_requests_total{job="demo-app", status=~"5.."}[6h])) or vector(0)
        - record: slo:demo_app:requests:increase30d
          expr: sum(increase(http_requests_total{job="demo-app"}[30d]))
        - record: slo:demo_app:errors:increase30d
          expr: sum(increase(http_requests_total{job="demo-app", status=~"5.."}[30d])) or vector(0)
        - record: slo:demo_app:error_ratio5m
          expr: slo:demo_app:errors:rate5m / slo:demo_app:requests:rate5m
        - record: slo:demo_app:error_ratio30m
          expr: slo:demo_app:errors:rate30m / slo:demo_app:requests:rate30m
        - record: slo:demo_app:error_ratio1h
          expr: slo:demo_app:errors:rate1h / slo:demo_app:requests:rate1h
        - record: slo:demo_app:error_ratio6h
          expr: slo:demo_app:errors:rate6h / slo:demo_app:requests:rate6h
        - record: slo:demo_app:error_ratio30d
          expr: slo:demo_app:errors:increase30d / slo:demo_app:requests:increase30d
        - record: slo:demo_app:burn_rate5m
          expr: slo:demo_app:error_ratio5m / 0.01
        - record: slo:demo_app:burn_rate30m
          expr: slo:demo_app:error_ratio30m / 0.01
        - record: slo:demo_app:burn_rate1h
          expr: slo:demo_app:error_ratio1h / 0.01
        - record: slo:demo_app:burn_rate6h
          expr: slo:demo_app:error_ratio6h / 0.01
        - record: slo:demo_app:budget_remaining_percent30d
          expr: clamp_min((1 - slo:demo_app:error_ratio30d / 0.01) * 100, 0)
    - name: demo-app.slo.alerts
      rules:
        - alert: HighErrorRate
          expr: slo:demo_app:error_ratio5m > 0.01
          for: 2m
          labels:
            severity: critical
            team: demo
          annotations:
            summary: "🚨 Высокий error rate в demo-app"
            description: "5xx ошибок больше 1% уже 2 минуты. Текущее значение: {{ $value | humanizePercentage }}"
        - alert: SLOBreach
          expr: (1 - slo:demo_app:error_ratio1h) * 100 < 99
          for: 5m
          labels:
            severity: critical
            team: demo
          annotations:
            summary: "💔 SLO пробит в demo-app"
            description: "Доступность за последний час ниже 99%. Текущее значение: {{ $value | humanize }}%"
        - alert: TargetDown
          expr: absent(up{job="demo-app"})
          for: 10s
          labels:
            severity: warning
            team: demo
          annotations:
            summary: "⚠️ demo-app полностью недоступен"
            description: "Prometheus не видит ни одной живой цели demo-app уже больше минуты."
            runbook_url: "https://raw.githubusercontent.com/MELS-010101/infra-ansible/main/monitoring/runbooks/target-down.md"
            diagnostic_queries: |
              Pods: kubectl get pods -n default -l app=demo-app -o wide
              Owner: kubectl get rollout demo-app -n default
              Restarts: kubectl get pods -n default -l app=demo-app -o jsonpath='{range .items[*]}{.metadata.name}{" restarts="}{.status.containerStatuses[0].restartCount}{"
"}{end}'
              Events: kubectl get events -n default --sort-by=.lastTimestamp | tail -20
        - alert: ErrorBudgetBurnFast
          expr: slo:demo_app:burn_rate5m > 14.4 and slo:demo_app:burn_rate1h > 14.4
          for: 5m
          labels:
            severity: critical
            team: demo
          annotations:
            summary: "🔥 Быстрое сжигание error budget (x14.4)"
            description: "Бюджет горит в 14.4 раза быстрее нормы: ~2% месячного бюджета за час. Реагировать немедленно!"
        - alert: ErrorBudgetBurnSlow
          expr: slo:demo_app:burn_rate30m > 6 and slo:demo_app:burn_rate6h > 6
          for: 30m
          labels:
            severity: warning
            team: demo
          annotations:
            summary: "🐢 Медленное сжигание error budget (x6)"
            description: "Бюджет горит в 6 раз быстрее нормы: ~5% бюджета за сутки. Разобраться в рабочее время."
