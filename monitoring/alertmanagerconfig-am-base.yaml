apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: am-base
  namespace: monitoring
spec:
  receivers:
  - name: "null"
  - name: telegram
    telegramConfigs:
    - botToken:
        key: bot_token
        name: telegram-credentials
      chatID: 176747361
      message: |
        {{ if eq .Status "firing" }}🚨 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }}: <b>{{ .GroupLabels.alertname }}</b>
        {{ range .Alerts }}
        <b>{{ .Annotations.summary }}</b>
        {{ .Annotations.description }}
        {{ if .Annotations.runbook_url }}📖 <a href="{{ .Annotations.runbook_url }}">Runbook</a>{{ end }}
        {{ if .Annotations.diagnostic_queries }}🔍 <b>Диагностика:</b>
        {{ .Annotations.diagnostic_queries }}{{ end }}
        {{ end }}
      parseMode: HTML
      sendResolved: true
  route:
    groupBy:
    - alertname
    groupInterval: 1m
    groupWait: 10s
    receiver: telegram
    repeatInterval: 1h
    routes:
    - matchers:
      - matchType: =~
        name: alertname
        value: Watchdog|InfoInhibitor|KubeSchedulerDown|KubeProxyDown|KubeAPIDown|KubeControllerManagerDown|KubeEtcdDown|KubeStateMetricsDown|NodeExporterDown|AlertmanagerDown|PrometheusDown|TargetDown.*Node.*
      receiver: "null"
