apiVersion: v1
data:
  slo-report.py: "import json, os, urllib.request, urllib.parse\n\nPROM = \"http://kube-prometheus-stack-prometheus.monitoring.svc:9090\"\nTOKEN
    = os.environ[\"TELEGRAM_TOKEN\"]\nCHAT = os.environ[\"TELEGRAM_CHAT_ID\"]\n\ndef
    q(expr):\n    url = PROM + \"/api/v1/query?\" + urllib.parse.urlencode({\"query\":
    expr})\n    with urllib.request.urlopen(url, timeout=30) as r:\n        res =
    json.load(r)[\"data\"][\"result\"]\n    return float(res[0][\"value\"][1]) if
    res else None\n\ndef avail(window):\n    err = q('sum(increase(http_requests_total{job=\"demo-app\",
    status=~\"5..\"}[%s])) or vector(0)' % window)\n    tot = q('sum(increase(http_requests_total{job=\"demo-app\"}[%s]))'
    % window)\n    if tot is None or tot == 0:\n        return None\n    return 100.0
    - (err / tot) * 100.0\n\na24, a7, a30 = avail(\"24h\"), avail(\"7d\"), avail(\"30d\")\nbudget
    = q(\"slo:demo_app:budget_remaining_percent30d\")\namfail = q('sum(increase(alertmanager_notification_failures_total[24h]))
    or vector(0)')\nburn6 = q('slo:demo_app:burn_rate6h')\nif budget is None or burn6
    is None or burn6 <= 0.05:\n    forecast = 'бюджет не расходуется (burn ~0)'\nelse:\n
    \   d = budget / burn6 * 0.3\n    forecast = ('~%.0f дн. до исчерпания бюджета'
    % d) if d <= 30 else '>30 дн. (расход минимальный)'\n\nurl = PROM + \"/api/v1/query?\"
    + urllib.parse.urlencode({\n    \"query\": 'count by (alertname)(count_over_time(ALERTS_FOR_STATE{alertname=~\"TargetDown|HighErrorRate|SLOBreach|ErrorBudgetBurn.*\"}[24h]))'})\nwith
    urllib.request.urlopen(url, timeout=30) as r:\n    inc = json.load(r)[\"data\"][\"result\"]\ninc_lines
    = \"\\n\".join(\"  - %s: %d раз(а)\" % (i[\"metric\"][\"alertname\"], int(float(i[\"value\"][1])))
    for i in inc) or \"  - нет\"\n\ndef fmt(v):\n    return \"n/a\" if v is None else
    \"%.3f%%\" % v\n\nmsg = (\"<b>\U0001F4CA Ежедневный SLO-отчёт: demo-app</b>\\n\"\n
    \      \"Доступность 24ч: %s\\n\"\n       \"Доступность 7д: %s\\n\"\n       \"Доступность
    30д: %s\\n\"\n       \"Error budget (30д) осталось: %s\\nПрогноз: %s\\nСбоев отправки
    алертов (24ч): %d\\n\"\n       \"Инциденты за 24ч:\\n%s\" % (fmt(a24), fmt(a7),
    fmt(a30), fmt(budget), forecast, int(amfail or 0), inc_lines))\n\nreq = urllib.request.Request(\n
    \   \"https://api.telegram.org/bot%s/sendMessage\" % TOKEN,\n    data=urllib.parse.urlencode({\"chat_id\":
    CHAT, \"text\": msg, \"parse_mode\": \"HTML\"}).encode())\nwith urllib.request.urlopen(req,
    timeout=30) as r:\n    print(json.load(r))\n"
kind: ConfigMap
metadata:
  name: slo-report-script
  namespace: monitoring
