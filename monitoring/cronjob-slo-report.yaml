apiVersion: batch/v1
kind: CronJob
metadata:
  name: slo-daily-report
  namespace: monitoring
spec:
  schedule: "0 9 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: python:3.12-alpine
              command: ["python3", "/scripts/slo-report.py"]
              env:
                - name: TELEGRAM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: telegram-credentials
                      key: bot_token
                - name: TELEGRAM_CHAT_ID
                  value: "176747361"
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: slo-report-script
