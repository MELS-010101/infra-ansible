replicas: 3
image:
  name: ghcr.io/mels-010101/infra-demo-app
  tag: "82c9e79608ddaa0f0326daad2d3ae8c076609957"
service:
  port: 8080
  nodePort: 30080
config:
  APP_NAME: infra-demo-k8s
env:
  OTEL_SERVICE_NAME: demo-app
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
ingress:
  enabled: true
  className: nginx
  host: demo.local
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
