---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ansible-lint + syntax check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible + lint
        run: pip install --quiet ansible-core ansible-lint

      - name: Install collections из requirements.yml
        run: ansible-galaxy collection install -r requirements.yml

      - name: Vault-pass заглушка (реальный ключ никогда не в CI)
        run: printf 'ci-dummy' > .vault_pass

      - name: Python compile-check acceptance-скрипта
        run: python3 -m py_compile roles/acceptance/files/infra_check.py roles/monitoring/files/alert_notify.py roles/app/files/app.py

      - name: Syntax check
        run: ansible-playbook -i inventory/inventory.ini playbooks/site.yml --syntax-check

      - name: Ansible-lint
        run: ansible-lint

  build:
    name: docker build + smoke test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t infra-demo-app:ci roles/app/files/

      - name: Smoke test
        run: |
          docker run -d --name demo -p 8085:8080 infra-demo-app:ci
          sleep 3
          curl -sf http://127.0.0.1:8085/ | grep -q '"app"'
          docker rm -f demo
